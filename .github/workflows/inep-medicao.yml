# INEP no runner, só para medir a coleta da F1c pela rota 1 (HTTPS, com o intermediário da RNP versionado e nova
# tentativa depois do reset do primeiro contato): tempo, tamanho, memória e acertos do cache. Disparo manual apenas,
# fora do Publicar. Sem tabelas, supressão nem site; nada vai para Releases.
#
# O cache do Actions guarda os arquivos que o runner baixou e conferiu, para a execução seguinte baixar só o que
# mudou na origem. A chave sai de build/inep/remoto.json, que tem caminho, tamanho e Last-Modified de cada arquivo,
# e nada mais: com a origem igual, a chave é a mesma, e o cache é usado inteiro; com um arquivo novo, a chave muda, o
# cache anterior é restaurado pelo prefixo, e só o arquivo novo é baixado. O cache não substitui o INEP: a consulta
# roda antes, sempre, e a coleta confere cada cópia pelo SHA-256.
# O que o cache guarda são os arquivos públicos do INEP como ele os publica, uma linha por escola, sem nada calculado
# aqui; workflows deste repositório, inclusive de pull requests, conseguem lê-lo. O artefato tem só metadados e
# contagens: tamanho, SHA-256, Last-Modified, tempos, tentativas, memória e o manifesto. Nada dos arquivos vai para o log.
name: INEP (medição)

on:
  workflow_dispatch:
    inputs:
      sem_cache:
        description: "Ignorar o cache e baixar tudo de novo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inep-medicao
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Início, máquina e memória amostrada a cada 5 s
        run: |
          mkdir -p build/inep-medicao
          date +%s > build/inep-medicao/inicio.txt
          { nproc; free -m; df -B1 --output=avail,size . | tail -1; } | tee build/inep-medicao/maquina.txt
          # Memória em uso na máquina inteira (MemTotal - MemAvailable, em kB), com o horário.
          cat > "$RUNNER_TEMP/memoria.sh" <<'SH'
          while true; do
            echo "$(date +%s) $(awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} END{print t-a}' /proc/meminfo)"
            sleep 5
          done
          SH
          nohup bash "$RUNNER_TEMP/memoria.sh" > build/inep-medicao/memoria.txt 2>/dev/null &

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # Só requirements.txt: a coleta do INEP não usa as dependências do SIH.
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A lista de municípios vem da DTB, como no Publicar. Nenhum dado do IBGE vira artefato aqui.
      - name: Lista de municípios
        run: python -m pipeline coletar --saida build/coleta --anterior manifesto/ibge.json

      - name: "INEP: consulta"
        run: |
          medir=(); if [ -x /usr/bin/time ]; then medir=(/usr/bin/time -v -o build/inep-medicao/consulta_time.txt); fi
          "${medir[@]}" python -m pipeline.inep consultar --saida build/inep
          cp build/inep/remoto.json build/inep/consulta.json build/inep-medicao/

      - name: Chave do cache
        id: chave
        run: echo "chave=inep-v1-$(sha256sum build/inep/remoto.json | cut -c1-64)" | tee -a "$GITHUB_OUTPUT"

      - name: "INEP: cache"
        id: restaurar
        if: ${{ !inputs.sem_cache }}
        uses: actions/cache/restore@v6
        with:
          path: ~/inep-cache
          key: ${{ steps.chave.outputs.chave }}
          restore-keys: inep-v1-

      - name: "INEP: coleta e contrato"
        run: |
          mkdir -p "$HOME/inep-cache"
          du -sb "$HOME/inep-cache" | tee build/inep-medicao/cache_antes.txt
          medir=(); if [ -x /usr/bin/time ]; then medir=(/usr/bin/time -v -o build/inep-medicao/coleta_time.txt); fi
          "${medir[@]}" python -m pipeline.inep coletar --remoto build/inep/remoto.json --cache "$HOME/inep-cache" \
            --municipios build/coleta/ibge.json --saida build/inep --anterior manifesto/inep.json --medicao build/inep-medicao
          cp build/inep/inep.json build/inep-medicao/
          du -sb "$HOME/inep-cache" | tee build/inep-medicao/cache_depois.txt

      # Só quando a chave não estava no cache: com a origem igual, a entrada que existe já tem estes arquivos.
      - name: "INEP: guardar no cache"
        if: ${{ success() && steps.restaurar.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/inep-cache
          key: ${{ steps.chave.outputs.chave }}

      - name: Resumo
        if: always()
        env:
          CHAVE: ${{ steps.chave.outputs.chave }}
          ACERTO: ${{ steps.restaurar.outputs.cache-hit }}
          CHAVE_ACHADA: ${{ steps.restaurar.outputs.cache-matched-key }}
          SEM_CACHE: ${{ inputs.sem_cache }}
        run: |
          python - <<'PY'
          import json, os, re, time
          from pathlib import Path
          pasta = Path("build/inep-medicao")
          def ler(nome):
              caminho = pasta / nome
              return caminho.read_text(encoding="utf-8") if caminho.exists() else ""
          memoria = []
          for linha in ler("memoria.txt").splitlines():
              partes = linha.split()
              if len(partes) == 2 and partes[1].isdigit():
                  memoria.append(int(partes[1]))
          def maximo_rss(nome):
              achado = re.search(r"Maximum resident set size \(kbytes\): (\d+)", ler(nome))
              return round(int(achado.group(1)) / 1024) if achado else None
          def segundos(nome):
              achado = re.search(r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\): ([\d:.]+)", ler(nome))
              if not achado:
                  return None
              partes = [float(p) for p in achado.group(1).split(":")]
              return round(sum(p * 60 ** i for i, p in enumerate(reversed(partes))), 1)
          coleta = json.loads(ler("coleta.json") or "{}")
          resumo = {"execucao": os.environ.get("GITHUB_RUN_ID"), "sem_cache": os.environ["SEM_CACHE"] == "true",
                    "chave": os.environ["CHAVE"], "cache_hit": os.environ["ACERTO"] or None,
                    "chave_restaurada": os.environ["CHAVE_ACHADA"] or None,
                    "cache_antes_bytes": int((ler("cache_antes.txt").split() or ["0"])[0]),
                    "cache_depois_bytes": int((ler("cache_depois.txt").split() or ["0"])[0]),
                    "consulta": {"s": segundos("consulta_time.txt"), "pico_rss_mb": maximo_rss("consulta_time.txt")},
                    "coleta": {"s": segundos("coleta_time.txt"), "pico_rss_mb": maximo_rss("coleta_time.txt"),
                               "cache": coleta.get("cache"), "avisos": coleta.get("avisos")},
                    "pico_memoria_maquina_mb": round(max(memoria, default=0) / 1024),
                    "total_s": int(time.time()) - int(ler("inicio.txt").strip() or time.time())}
          (pasta / "resumo.json").write_text(json.dumps(resumo, ensure_ascii=False, indent=1), encoding="utf-8")
          linhas = ["### INEP (medição)", "", "| Item | Valor |", "|---|---|"]
          linhas += [f"| {k} | {json.dumps(v, ensure_ascii=False)} |" for k, v in resumo.items()]
          if coleta:
              linhas += ["", "| Arquivo | Origem | Bytes | Download (s) | Tentativas | Contrato (s) |", "|---|---|---:|---:|---:|---:|"]
              for nome, item in coleta["arquivos"].items():
                  linhas.append(f"| {nome} | {item['origem']} | {item['bytes']} | {item.get('s_download', '-')} | "
                                f"{len(item.get('tentativas', []))} | {item['s_contrato']} |")
          texto = "\n".join(linhas) + "\n"
          print(texto)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as arquivo:
              arquivo.write(texto)
          PY

      # Só os JSON e textos de medição desta pasta; os arquivos do INEP estão em ~/inep-cache, fora dela.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inep-medicao
          path: build/inep-medicao
          retention-days: 30
